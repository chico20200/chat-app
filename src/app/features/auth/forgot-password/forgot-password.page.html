<ion-header>
  <ion-toolbar>
    <ion-title>Recuperar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (sent()) {
    <ion-text color="success">
      <p>Si existe una cuenta con ese correo, te enviamos un enlace para cambiar la contraseña. Revisa también la carpeta de spam.</p>
    </ion-text>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-input formControlName="email" type="email" label="Correo" labelPlacement="floating" fill="outline"
        autocomplete="email" errorText="Ingresa un correo válido"></ion-input>

      @if (error()) {
        <ion-text color="danger"><p>{{ error() }}</p></ion-text>
      }

      <ion-button expand="block" type="submit" [disabled]="loading()" class="ion-margin-top">
        @if (loading()) { <ion-spinner name="crescent"></ion-spinner> } @else { Enviar enlace }
      </ion-button>
    </form>
  }

  <p class="ion-text-center"><a routerLink="/login">Volver al inicio de sesión</a></p>
</ion-content>
