<ion-header>
  <ion-toolbar>
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-list>
      <ion-input formControlName="name" label="Nombre" labelPlacement="floating" fill="outline"
        autocomplete="name" errorText="El nombre es obligatorio (máx. 40 caracteres)"></ion-input>

      <ion-input formControlName="email" type="email" label="Correo" labelPlacement="floating" fill="outline"
        autocomplete="email" errorText="Ingresa un correo válido" class="ion-margin-top"></ion-input>

      <ion-input formControlName="password" type="password" label="Contraseña" labelPlacement="floating"
        fill="outline" autocomplete="new-password" errorText="Mínimo 6 caracteres" class="ion-margin-top"></ion-input>

      <ion-input formControlName="confirm" type="password" label="Repite la contraseña" labelPlacement="floating"
        fill="outline" autocomplete="new-password" errorText="Confirma tu contraseña" class="ion-margin-top"></ion-input>
    </ion-list>

    @if (form.hasError('passwordsMismatch') && form.controls.confirm.touched) {
      <ion-text color="danger"><p>Las contraseñas no coinciden.</p></ion-text>
    }

    @if (error()) {
      <ion-text color="danger"><p>{{ error() }}</p></ion-text>
    }

    <ion-button expand="block" type="submit" [disabled]="loading()" class="ion-margin-top">
      @if (loading()) { <ion-spinner name="crescent"></ion-spinner> } @else { Registrarme }
    </ion-button>
  </form>

  <p class="ion-text-center">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</ion-content>
