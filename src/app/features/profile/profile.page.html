<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Mi perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (profileService.myProfile(); as profile) {
    <div class="ion-text-center ion-margin-bottom">
      <app-avatar [src]="profile.avatar_url" [name]="profile.display_name" [size]="96" />
      <input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
      <div>
        <ion-button fill="clear" size="small" (click)="fileInput.click()" [disabled]="uploading()">
          @if (uploading()) { <ion-spinner name="dots"></ion-spinner> } @else { Cambiar foto }
        </ion-button>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()">
      <ion-input
        formControlName="display_name"
        label="Nombre"
        labelPlacement="floating"
        fill="outline"
        [counter]="true"
        maxlength="40"
        errorText="El nombre es obligatorio (máx. 40)"
      ></ion-input>

      <ion-textarea
        formControlName="bio"
        label="Bio"
        labelPlacement="floating"
        fill="outline"
        [autoGrow]="true"
        [counter]="true"
        maxlength="160"
        class="ion-margin-top"
      ></ion-textarea>

      @if (error()) {
        <ion-text color="danger"><p>{{ error() }}</p></ion-text>
      }

      <ion-button expand="block" type="submit" [disabled]="saving() || form.pristine" class="ion-margin-top">
        @if (saving()) { <ion-spinner name="crescent"></ion-spinner> } @else { Guardar }
      </ion-button>
    </form>

    <ion-text color="medium">
      <p><small>Miembro desde {{ profile.created_at.slice(0, 10) }}</small></p>
    </ion-text>
  } @else {
    <div class="ion-text-center"><ion-spinner></ion-spinner></div>
  }
</ion-content>
