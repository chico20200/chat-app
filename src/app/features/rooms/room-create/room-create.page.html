<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/rooms"></ion-back-button>
    </ion-buttons>
    <ion-title>Nueva sala</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-input formControlName="name" label="Nombre" labelPlacement="floating" fill="outline"
      [counter]="true" maxlength="50" errorText="El nombre es obligatorio (máx. 50)"></ion-input>

    <ion-textarea formControlName="description" label="Descripción (opcional)" labelPlacement="floating"
      fill="outline" [autoGrow]="true" [counter]="true" maxlength="200" class="ion-margin-top"></ion-textarea>

    <ion-toggle formControlName="isPrivate" class="ion-margin-top">
      Sala privada
    </ion-toggle>
    <ion-text color="medium">
      <p><small>
        @if (form.controls.isPrivate.value) {
          Solo podrán entrar las personas que tú agregues.
        } @else {
          Aparecerá en "Explorar" y cualquiera podrá unirse.
        }
      </small></p>
    </ion-text>

    @if (error()) {
      <ion-text color="danger"><p>{{ error() }}</p></ion-text>
    }

    <ion-button expand="block" type="submit" [disabled]="saving()" class="ion-margin-top">
      @if (saving()) { <ion-spinner name="crescent"></ion-spinner> } @else { Crear sala }
    </ion-button>
  </form>
</ion-content>
