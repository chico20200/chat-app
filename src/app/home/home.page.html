<ion-header>
  <ion-toolbar>
    <ion-title>Chat EPN</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (profileService.myProfile(); as profile) {
    <div class="ion-text-center">
      <app-avatar [src]="profile.avatar_url" [name]="profile.display_name" [size]="72" />
      <p>Hola, <strong>{{ profile.display_name }}</strong></p>
      <p><small>{{ authService.user()?.email }}</small></p>
      <ion-button routerLink="/rooms">Salas</ion-button>
      <ion-button routerLink="/profile" fill="outline">Mi perfil</ion-button>                                              <!-- PRUEBA -->
    </div>
  }
</ion-content>
